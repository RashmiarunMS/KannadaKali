<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KannadaKali - Missing Word</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Kannada:wght@400;600;700&display=swap"
      rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="game">

        <h1>ಕನ್ನಡ ಕಲಿ 🪶</h1>

        <h2>Complete the sentence</h2>

        <p>Drag the correct word into the blank.</p>

<div class="sentence">
    <span id="sentence-before"></span>

    <span id="drop-zone" class="drop-zone">
        ______
    </span>

    <span id="sentence-after"></span>
</div>
        <div class="word-bank">

    <div class="word" draggable="true">ಯಾರು</div>
    <div class="word" draggable="true">ಎಲ್ಲಿಗೆ</div>
    <div class="word" draggable="true">ಏಕೆ</div>
    <div class="word" draggable="true">ಯಾವಾಗ</div>
    <div class="word" draggable="true">ಏನು</div>

</div>
<p id="feedback"></p>

<p id="progress"></p>

<button id="next-button" hidden>
    ಮುಂದಿನ ಪ್ರಶ್ನೆ →
</button>

<button id="play-again-button" hidden>
    ಮತ್ತೊಮ್ಮೆ ಆಡು ↻
</button>

    </main>

    <script src="script.js"></script>

</body>
</html>
