<!DOCTYPE html>
<html lang="kn">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KannadaKali - ಸಮಾನಾರ್ಥಕ ಪದಗಳು</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Kannada:wght@400;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="game-container">

        <h1>ಸಮಾನಾರ್ಥಕ ಪದಗಳು</h1>

        <p class="instruction">
            ಸಮಾನಾರ್ಥಕ ಪದಗಳನ್ನು ಹುಡುಕಿ
        </p>

        <div id="question-area" class="question-area">
        </div>

        <div id="word-area" class="word-area">
        </div>

        <p id="feedback"></p>

        <button id="next-button" hidden>
            ಮುಂದಿನ ಪ್ರಶ್ನೆ →
        </button>

        <button id="play-again-button" hidden>
            ಮತ್ತೊಮ್ಮೆ ಆಡು ↻
        </button>

    </main>

    <script src="script.js"></script>

</body>

</html>
